name: mirror-cli-binaries

# One-shot mirror workflow.
#
# Copies CLI binaries from GitHub Releases (slow from Asia, especially for
# arm64 binaries) to Docker Hub (fast Cloudflare CDN with Asia POPs).
#
# Run this manually from the Actions tab whenever you bump ARGOCD_VERSION
# or YQ_VERSION in <app_name>-cicd.yaml. It runs on a GitHub-hosted runner
# where the fetch from GitHub Releases is fast (internal network), then
# pushes to Docker Hub for the CD job to consume.

on:
  workflow_dispatch:
    inputs:
      argocd_version:
        description: "ArgoCD CLI version to mirror (e.g., v3.4.2). Leave blank to skip."
        required: false
        default: "v3.4.2"
      yq_version:
        description: "yq version to mirror (e.g., v4.44.3). Leave blank to skip."
        required: false
        default: "v4.44.3"

permissions:
  contents: read

jobs:
  mirror:
    # GitHub-hosted runner — fast egress to both GitHub Releases and Docker Hub.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ '${{ secrets.DOCKERHUB_USERNAME }}' }}
          password: ${{ '${{ secrets.DOCKERHUB_TOKEN }}' }}

      # Required to build a multi-arch manifest list (amd64 + arm64) from a
      # single amd64 GitHub-hosted runner.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Mirror ArgoCD CLI (amd64 + arm64)
        if: inputs.argocd_version != ''
        run: |
          set -euo pipefail
          ARGOCD_VERSION="${{ '${{ inputs.argocd_version }}' }}"
          mkdir -p ctx-argocd && cd ctx-argocd
          for arch in amd64 arm64; do
            echo "Downloading argocd ${ARGOCD_VERSION} ${arch}..."
            time curl -fSL --retry 3 --retry-delay 5 -o "argocd-${arch}" \
              "https://github.com/argoproj/argo-cd/releases/download/${ARGOCD_VERSION}/argocd-linux-${arch}"
            chmod +x "argocd-${arch}"
          done
          # CMD is required so consumers can docker create without supplying
          # an arg. The binary itself doesn't run as a container (FROM scratch
          # has no shell or libc), but CMD satisfies the daemon's requirement.
          cat > Dockerfile <<'DOCKERFILE'
FROM scratch
ARG TARGETARCH
COPY argocd-${TARGETARCH} /argocd
CMD ["/argocd"]
DOCKERFILE
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --tag "christseng89/argocd-bin:${ARGOCD_VERSION}" \
            --push \
            .
          echo "::notice::Mirrored christseng89/argocd-bin:${ARGOCD_VERSION} (amd64+arm64)"

      - name: Mirror yq (amd64 + arm64)
        if: inputs.yq_version != ''
        run: |
          set -euo pipefail
          YQ_VERSION="${{ '${{ inputs.yq_version }}' }}"
          mkdir -p ctx-yq && cd ctx-yq
          for arch in amd64 arm64; do
            echo "Downloading yq ${YQ_VERSION} ${arch}..."
            time curl -fSL --retry 3 --retry-delay 5 -o "yq-${arch}" \
              "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_${arch}"
            chmod +x "yq-${arch}"
          done
          cat > Dockerfile <<'DOCKERFILE'
FROM scratch
ARG TARGETARCH
COPY yq-${TARGETARCH} /yq
CMD ["/yq"]
DOCKERFILE
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --tag "christseng89/yq-bin:${YQ_VERSION}" \
            --push \
            .
          echo "::notice::Mirrored christseng89/yq-bin:${YQ_VERSION} (amd64+arm64)"

      - name: Summary
        if: always()
        run: |
          ARGOCD_VERSION="${{ '${{ inputs.argocd_version }}' }}"
          YQ_VERSION="${{ '${{ inputs.yq_version }}' }}"
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## Mirror complete

          | Image | Tag | Pull command |
          |---|---|---|
          | argocd | ${ARGOCD_VERSION:-_(skipped)_} | \`docker pull christseng89/argocd-bin:${ARGOCD_VERSION}\` |
          | yq     | ${YQ_VERSION:-_(skipped)_}     | \`docker pull christseng89/yq-bin:${YQ_VERSION}\` |
          EOF
