apiVersion: v1
kind: Namespace
metadata:
  name: ${{values.app_name}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: arc-runner-reader
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: arc-runner-reader-${{values.app_name}}
subjects:
  - kind: ServiceAccount
    name: default
    namespace: ${{values.app_name}}
roleRef:
  kind: ClusterRole
  name: arc-runner-reader
  apiGroup: rbac.authorization.k8s.io
